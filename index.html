
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">

  <title>OPEN Mini App</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --purple: #6535ed;
      --pink: #e53683;
      --orange: #ff9436;
      --text: #222222;
      --muted: #7b8494;
      --border: #e1e5ed;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #ffffff;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 48px 26px 30px;
      text-align: center;
    }

    .logo {
      width: 88px;
      height: 88px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
      border-radius: 26px;
      background: linear-gradient(
        135deg,
        var(--purple),
        var(--pink),
        var(--orange)
      );
      color: #ffffff;
      font-size: 46px;
      font-weight: bold;
      box-shadow: 0 8px 24px rgba(229, 54, 131, 0.18);
    }

    h1 {
      margin: 0;
      font-size: 32px;
      letter-spacing: -1px;
    }

    .subtitle {
      margin: 18px 0 38px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }

    .field {
      margin-bottom: 15px;
      text-align: left;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: bold;
      color: #596273;
    }

    .field input {
      width: 100%;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: #fafbfc;
      color: var(--text);
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    .field input:focus {
      border-color: var(--purple);
      background: #ffffff;
    }

    .password-box {
      position: relative;
    }

    .password-box input {
      padding-right: 65px;
    }

    .show-password {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: #697386;
      font-size: 13px;
      cursor: pointer;
    }

    .main-button {
      display: block;
      width: 100%;
      margin-top: 24px;
      padding: 17px;
      border: none;
      border-radius: 13px;
      background: linear-gradient(
        100deg,
        var(--purple),
        var(--pink),
        var(--orange)
      );
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(229, 54, 131, 0.16);
    }

    .main-button:active {
      transform: scale(0.99);
    }

    .error {
      min-height: 22px;
      margin-top: 18px;
      color: #e0245e;
      font-size: 14px;
    }

    .success {
      display: none;
      padding-top: 24px;
    }

    .checkmark {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #e9f9f1;
      color: #20a56d;
      font-size: 43px;
    }

    .success h2 {
      color: #20976a;
      font-size: 24px;
    }

    .success p {
      color: var(--muted);
      line-height: 1.6;
    }

    .logout-button {
      margin-top: 20px;
      border: none;
      background: transparent;
      color: #777;
      font-size: 14px;
      cursor: pointer;
    }

    .footer {
      margin-top: 65px;
      color: #a1a7b2;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="container">

    <div class="logo">O</div>

    <h1>OPEN Mini App</h1>

    <p class="subtitle">
      Xush kelibsiz! Davom etish uchun
      Mini App login va kirish kodini kiriting.
    </p>

    <form id="loginPanel">

      <div class="field">
        <label for="username">Login</label>
        <input
          id="username"
          type="text"
          placeholder="Login nomingiz"
          autocomplete="off"
          required
        >
      </div>

      <div class="field">
        <label for="accessCode">Kirish kodi</label>

        <div class="password-box">
          <input
            id="accessCode"
            type="password"
            placeholder="Kirish kodini kiriting"
            autocomplete="off"
            required
          >

          <button
            type="button"
            class="show-password"
            onclick="togglePassword()"
          >
            Ko‘rsat
          </button>
        </div>
      </div>

      <button type="submit" class="main-button">
        Kirish
      </button>

      <p id="error" class="error"
         aria-live="polite"></p>
    </form>

    <section id="successPanel" class="success">
      <div class="checkmark">✓</div>

      <h2>Kirish muvaffaqiyatli!</h2>

      <p>
        Davom etish uchun quyidagi
        tugmani bosing.
      </p>

      <button
        type="button"
        class="main-button"
        onclick="openInstagram()"
      >
        OPEN OCHISH
      </button>

      <button
        type="button"
        class="logout-button"
        onclick="resetLogin()"
      >
        Chiqish
      </button>
    </section>

    <div class="footer">
      OPEN Mini App • Telegram uchun
    </div>

  </main>

  <script>
    const tg = window.Telegram?.WebApp;

    // Faqat namoyish uchun kirish kodi.
    // GitHub Pages'da bu kod maxfiy emas.
    const DEMO_CODE = "1202.1905.0305";

    if (tg) {
      tg.ready();
      tg.expand();
    }

    const loginPanel =
      document.getElementById("loginPanel");

    const successPanel =
      document.getElementById("successPanel");

    const usernameInput =
      document.getElementById("username");

    const codeInput =
      document.getElementById("accessCode");

    const errorText =
      document.getElementById("error");

    function resetLogin() {
      loginPanel.style.display = "block";
      successPanel.style.display = "none";

      usernameInput.value = "";
      codeInput.value = "";
      codeInput.type = "password";

      errorText.textContent = "";
    }

    function togglePassword() {
      codeInput.type =
        codeInput.type === "password"
          ? "text"
          : "password";
    }

    loginPanel.addEventListener(
      "submit",
      function(event) {
        event.preventDefault();

        const username =
          usernameInput.value.trim();

        const code =
          codeInput.value.trim();

        errorText.textContent = "";

        if (!username || !code) {
          errorText.textContent =
            "Login va kirish kodini kiriting!";
          return;
        }

        // Login maydoni bo'sh emasligi tekshiriladi.
        // Haqiqiy login identifikatsiyasi emas.
        if (code === DEMO_CODE) {
          loginPanel.style.display = "none";
          successPanel.style.display = "block";
          codeInput.value = "";
        } else {
          errorText.textContent =
            "Kirish kodi noto'g'ri!";
        }
      }
    );

    function openInstagram() {
      const url =
        "https://www.instagram.com/direct/inbox/";

      if (tg) {
        tg.openLink(url);
      } else {
        window.open(
          url,
          "_blank",
          "noopener,noreferrer"
        );
      }
    }

    // Sahifa yangilanganda yoki qayta ochilganda
    // login oynasini ko'rsatish.
    window.addEventListener(
      "pageshow",
      resetLogin
    );

    // Mini App oynasi qayta faollashganda
    // loginni tiklash.
    document.addEventListener(
      "visibilitychange",
      function() {
        if (document.visibilityState === "visible") {
          resetLogin();
        }
      }
    );

    resetLogin();
  </script>
</body>
</html>
